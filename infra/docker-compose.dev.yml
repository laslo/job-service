# Local development stack (Stage 2: PostgreSQL only).
# Brought up by `pnpm db:up`; later stages add Kafka and other services here.

name: job-service-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: job-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_service}
      POSTGRES_DB: ${POSTGRES_DB:-job_service}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_service} -d ${POSTGRES_DB:-job_service}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
